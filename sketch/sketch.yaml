# App Lab builds this with a profile, and a profile resolves nothing for itself: every
# transitive dependency has to be named with an exact version or the build fails. The versions
# below are the ones actually installed on the board (`arduino-cli lib list`) for the Bridge
# stack, and for the sensor libraries the ones the shipped App Lab examples pin - which is the
# only evidence available that they compile against this zephyr core.
#
# The platform is deliberately left unversioned. Every App Lab example does the same, and
# pinning it is what broke the first start here: `arduino:zephyr` with no version resolves to
# the installed core, while a placeholder version fails with "no major version found".
profiles:
  default:
    platforms:
      - platform: arduino:zephyr
    libraries:
      - Arduino_RouterBridge (0.4.3)
      - dependency: Arduino_RPClite (0.3.0)
      - dependency: ArxContainer (0.7.0)
      - dependency: ArxTypeTraits (0.3.2)
      - dependency: DebugLog (0.8.4)
      - dependency: MsgPack (0.4.2)
      - dependency: ArduinoGraphics (1.1.4)
      - dependency: Arduino_HS300x (1.0.0)
      - dependency: Arduino_LPS22HB (1.0.2)
      - dependency: Arduino_LSM6DSOX (1.1.2)
      - dependency: Arduino_LTR381RGB (1.0.0)
      - dependency: STM32duino VL53L4CD (1.0.5)
      - dependency: STM32duino VL53L4ED (1.0.1)
default_profile: default
